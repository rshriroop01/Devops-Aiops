apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/rshriroop01/Devops-Aiops.git'
    targetRevision: main
    path: gitops
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: boutique
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  # syncPolicy:
  #   automated:
  #     prune: true
  #     selfHeal: true
